# ARFABIT settings.
#
# Copy this to your settings file and change what you like. Everything here is
# optional: leaving a line out keeps ARFABIT's own default.
#
# Where this file goes:
#   macOS    ~/Library/Application Support/arfabit/config.local.toml
#   Windows  %APPDATA%\arfabit\config.local.toml
#   Linux    ~/.config/arfabit/config.local.toml
#
# Settings are read in three layers, each overriding the one before:
#   1. ARFABIT's built-in defaults
#   2. config.toml in the data folder, which can live on a NAS and be shared
#   3. config.local.toml, this file, for whatever is particular to this machine
#
# The web page shows which layer each setting came from, so you never have to
# guess which file to edit.

[node]
# What this computer is called in the web page.
name = "living-room-mac"

[paths]
# Where ARFABIT keeps its own records. Put this on a NAS to share it between
# computers; each one writes only in its own folder, so they cannot collide.
# data = "/Volumes/nas/arfabit"

# Your films, one folder each, named the way Plex, Infuse and Jellyfin expect.
# Each disc's original goes in its film's folder too, as the edition
# "Original": the disc exactly as it is, every track. Originals are large, and
# ARFABIT never removes them: when you want the space back, move one to the
# trash yourself.
library = "~/Downloads/arfabit/library"

# Where originals were kept before they moved beside their films. Anything
# already there is still offered to make films and clips from, and ARFABIT
# puts nothing new there.
masters = "~/Downloads/arfabit/masters"

# Test clips from the quality lab. They are named so a folder listing reads
# plainly, and they are meant to be copied to a television and watched.
clips = "~/Downloads/arfabit/clips"

[server]
# Where the web page is served. The default listens on every network, so you
# can open it from any device in the house.
addr = ":7847"

[machine]
# How many films may be converted at once, counting test clips from the lab.
#
# One is usually fastest. Converting already uses every core your computer has,
# so a second one at the same time does not finish sooner — it makes both
# later, and makes both estimates wrong. Reading discs is not affected: the
# next disc goes in as soon as the last one comes out, whatever is converting.
max_conversions = 1

[drive]
# How much ARFABIT buffers while reading a disc, in megabytes.
#
# Leave this out and MakeMKV chooses, which is almost always right. It is here
# only because a wrong value has an enormous effect: reading a disc through a
# very small buffer can hold a fast drive to walking pace.
# read_cache_mb = 0

[makemkv]
# Ignore anything shorter than this when looking for the movie. Two minutes
# hides menus and studio logos. Set it lower only if a disc seems to be hiding
# something.
min_title_seconds = 120

# What every plan starts from, for ripping and transcoding alike. When a disc
# is read these are copied into its plan, and you can change them there for
# that disc alone.
[defaults]

# Picture quality, per kind of disc. Lower numbers mean better quality and
# bigger files. 20 is close to indistinguishable from the disc; below about 16
# you are mostly storing the disc's own compression noise.
crf_uhd = 20
crf_bluray = 20
crf_dvd = 18

# How hard the encoder works. Slower is smaller at the same quality.
# One of: superfast, medium, slow, slower, veryslow
preset = "slow"

# 4K discs are already in the format an Apple TV wants, so ARFABIT can copy
# the picture exactly instead of converting it. Much faster, and nothing is
# lost, but the file stays as large as the disc.
allow_uhd_copy = true

# Sound that plays directly (docs/ARCHITECTURE.md §4) is copied across
# untouched, which is instant and loses nothing. Dolby TrueHD, which does not,
# is made into FLAC, which is still lossless. Turning this off converts lossy
# sound too.
copy_native_audio = true
audio_bitrate = "256k"

# Subtitles. Forced subtitles are the ones that appear on their own when
# somebody speaks another language.
include_forced_subs = true
include_full_subs = true
sub_languages = ["eng"]
# A Blu-ray's subtitles are pictures, which make Plex convert the whole
# picture to show them. They are read into text where this computer can;
# turn this on to keep them as pictures instead.
keep_subtitle_pictures = false

# Converting after the copy is made. Turn this off to stop at the copy, which
# is the fast way through a stack of discs; convert later from the copy.
convert_after_rip = true

# Blueprints: starter templates for planning a job to rip or transcode.
#
# Each one starts from the defaults above and changes only what it names, so a
# blueprint that differs in quality alone says only that. You need none at all.
# They can also be made on the web page, where one can be chosen to be used by
# default, and several can be ticked in the Transcode section to compare.
#
# A blueprint's edition is what Plex shows as the name of that version, and
# goes in the filename as {edition-...}. It is the blueprint's name unless you
# give one; edition = "" means none. It can still be changed on each plan.
#
# [blueprint.Small]
# crf_bluray = 24
# preset = "medium"
#
# [blueprint.Cut]
# edition = "Director's Cut"
#
# [blueprint.Exact]
# allow_uhd_copy = true
# copy_native_audio = true
