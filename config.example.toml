# ARFABIT settings.
#
# Copy this to your settings file and change what you like. Everything here is
# optional: leaving a line out keeps ARFABIT's own default.
#
# Where this file goes:
#   macOS    ~/Library/Application Support/arfabit/config.local.toml
#   Windows  %APPDATA%\arfabit\config.local.toml
#   Linux    ~/.config/arfabit/config.local.toml
#
# Settings are read in three layers, each overriding the one before:
#   1. ARFABIT's built-in defaults
#   2. config.toml in the data folder, which can live on a NAS and be shared
#   3. config.local.toml, this file, for whatever is particular to this machine
#
# The web page shows which layer each setting came from, so you never have to
# guess which file to edit.

[node]
# What this computer is called in the web page.
name = "living-room-mac"

[paths]
# Where ARFABIT keeps its own records. Put this on a NAS to share it between
# computers; each one writes only in its own folder, so they cannot collide.
# data = "/Volumes/nas/arfabit"

# Your library: one folder per film, named the way Plex, Infuse and Jellyfin
# expect. Each disc's original goes in its film's folder, as the edition
# "Original": the disc exactly as it is, every track. Everything made from it
# goes beside it, each under the edition you give it. Originals are large, and
# ARFABIT never removes them: when you want the space back, move one to the
# trash yourself.
library = "~/Downloads/arfabit"

[server]
# Where the web page is served. The default listens on every network, so you
# can open it from any device in the house.
addr = ":7847"

[machine]
# How many files may be converted at once, whole or in part.
#
# One is usually fastest. Converting already uses every core your computer has,
# so a second one at the same time does not finish sooner — it makes both
# later, and makes both estimates wrong. Reading discs is not affected: the
# next disc goes in as soon as the last one comes out, whatever is converting.
max_conversions = 1

[drive]
# How much ARFABIT buffers while reading a disc, in megabytes.
#
# Leave this out and MakeMKV chooses, which is almost always right. It is here
# only because a wrong value has an enormous effect: reading a disc through a
# very small buffer can hold a fast drive to walking pace.
# read_cache_mb = 0

[makemkv]
# Ignore anything shorter than this when looking for the movie. Two minutes
# hides menus and studio logos. Set it lower only if a disc seems to be hiding
# something.
min_title_seconds = 120

# What every project starts from, disc or file, unless a blueprint is used:
# what to make of the video, the audio and the subtitles, and as what. They
# fill in the line items, which you can then change for that project alone.
[defaults]

# --- Video: "convert" to HEVC, "copy" exactly as it is, or "none".
video = "convert"

# Quality, per kind of disc. Lower numbers mean better quality and bigger
# files. 20 is close to indistinguishable from the disc; below about 16 you
# are mostly storing the disc's own compression noise.
crf_uhd = 20
crf_bluray = 20
crf_dvd = 18

# How hard the encoder works. Slower is smaller at the same quality.
# One of: superfast, medium, slow, slower, veryslow
preset = "slow"

# 4K discs are already HEVC, so even when converting, their video can be kept
# exactly as it is. Much faster, and nothing is lost, but the file stays as
# large as the disc.
allow_uhd_copy = true

# --- Audio: "copy" exactly as it is, "convert" (lossless to FLAC, lossy by
# how wide it is), or "none". A stereo track is added when the disc has none.
audio = "copy"
audio_bitrate = "256k"

# Dolby TrueHD, which Plex converts every time it plays on an Apple TV:
# "keep" it, make it "flac" (still lossless), or "both".
truehd = "keep"

# --- Subtitles: "text" reads a Blu-ray's picture subtitles into text where
# this computer can (pictures make Plex convert the whole video to show
# them), "pictures" keeps them as they are, "none" leaves them out.
subtitles = "text"
# Which languages, for subtitles; audio in them comes first too. Leave it
# empty for every language.
sub_languages = ["eng"]

# --- As what: "mkv", or "mp4", which has not been tried on an Apple TV.
container = "mkv"

# Blueprints: named recipes for what to make.
#
# Each one starts from the defaults above and changes only what it names, so a
# blueprint that differs in quality alone says only that. You need none at all.
# They can also be made on the web page, where one can be chosen to be used by
# default, and where audio can be chosen by rule.
#
# A blueprint's edition is what Plex shows as the name of that version, and
# goes in the filename as {edition-...}. It is the blueprint's name unless you
# give one; edition = "" means none. It can still be changed on each project.
#
# [blueprint.Small]
# crf_bluray = 24
# preset = "medium"
#
# [blueprint.Cut]
# edition = "Director's Cut"
#
# [blueprint.Exact]
# video = "copy"
# audio = "copy"
